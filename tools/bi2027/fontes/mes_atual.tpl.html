<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mês atual</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f3ee;--fg:#16181d;--mut:#8a8c93;--ok:#0f9d6b;--warn:#c98a00;--bad:#e05252}
*{box-sizing:border-box}body{margin:0;background:#d9d5ca;font:14px/1.35 Inter,system-ui,sans-serif;color:var(--fg)}
.phone{width:390px;max-width:100%;height:844px;margin:16px auto;background:var(--bg);border-radius:30px;box-shadow:0 24px 60px -24px rgba(0,0,0,.4);display:flex;flex-direction:column;overflow:hidden}
.num{font-variant-numeric:tabular-nums}
.head{padding:16px 16px 0}
.bk{display:flex;align-items:center;gap:10px;margin-bottom:10px}.bk button{all:unset;width:34px;height:34px;border-radius:12px;background:#fff;display:grid;place-items:center;font-size:16px;cursor:pointer;box-shadow:0 4px 10px -6px rgba(0,0,0,.3)}
.bk h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em}.bk p{margin:0;font-size:11.5px;color:var(--mut)}
.hero{background:#16181d;color:#fff;border-radius:22px;padding:14px 15px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-50px;top:-50px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(255,192,0,.25),transparent 70%)}
.cap{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#9fa1a9}
.hrow{display:flex;justify-content:space-between;align-items:flex-end;margin-top:3px}
.hrow b{font-size:34px;font-weight:900;color:#ffc000;letter-spacing:-.03em;line-height:1}.hrow span{font-size:11.5px;color:#c9cad0;text-align:right}
.trk{height:8px;border-radius:99px;background:rgba(255,255,255,.12);display:flex;overflow:hidden;margin-top:10px}
.trk i{display:block;height:100%}.f{background:var(--c,#ffc000)}.c{background:repeating-linear-gradient(-45deg,rgba(255,255,255,.5) 0 4px,transparent 4px 8px),var(--c,#ffc000);opacity:.55;background-size:11px 11px;animation:mv 1s linear infinite}
@keyframes mv{to{background-position:11px 0}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.stats div{background:rgba(255,255,255,.07);border-radius:10px;padding:6px 8px;font-size:10.5px;color:#9fa1a9}.stats b{display:block;font-size:15px;color:#fff;font-weight:800}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 16px 8px;scrollbar-width:none}
.chips button{all:unset;cursor:pointer;flex:none;padding:7px 12px;border-radius:99px;background:#fff;font-size:12px;font-weight:700;color:#4a4c55;box-shadow:0 4px 10px -8px rgba(0,0,0,.3)}
.chips button.on{background:#16181d;color:#ffc000}.chips small{opacity:.6;margin-left:4px}
.th{padding:4px 24px 6px !important;display:grid;grid-template-columns:minmax(0,1fr) 44px 42px 38px 44px 30px;gap:5px;padding:4px 26px 6px;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:700}
.th span{text-align:right}
.list{flex:1;overflow-y:auto;margin:0 12px 12px;background:#fff;border-radius:18px;box-shadow:0 8px 20px -14px rgba(0,0,0,.35);padding:2px 12px}
.r{padding:9px 0;border-top:1px solid #f0ede6}.r:first-child{border-top:0}
.g{display:grid;grid-template-columns:minmax(0,1fr) 44px 42px 38px 44px 30px;gap:5px;align-items:center}
.g .nm{font-size:11.5px;font-weight:700;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.g span{text-align:right;font-size:11.5px;font-weight:600}
.g .o{font-weight:800}.g .cart{color:#8a6a00}
.dd{justify-self:end;font-size:10.5px !important;font-weight:800 !important;border-radius:99px;padding:2px 5px;min-width:28px;text-align:center !important}
.d-ok{background:#e3f5ed;color:#0f9d6b}.d-w{background:#fff4d6;color:#b07d00}.d-b{background:#fde4e4;color:#d64545}
.mini{height:5px;border-radius:99px;background:#efece5;display:flex;overflow:hidden;margin-top:6px}
.r .sub{display:flex;justify-content:space-between;font-size:10.5px;color:var(--mut);margin-top:4px}.r .sub b{font-weight:800}
.nav{display:grid;grid-template-columns:repeat(5,1fr);background:#fff;padding:9px 6px 16px;border-top:1px solid #ece9e1}
.nav button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:#3a3c44}
.nav button span{width:40px;height:30px;border-radius:12px;display:grid;place-items:center;font-size:16px;background:#f3f1ea}
.nav button.on span{background:#16181d}.nav button.on{color:#16181d}
</style></head><body>
<div class="phone">
 <div class="head">
  <div class="bk"><button>←</button><div><h1>Mês atual</h1><p>Novembro · clientes ativos · dados de 19/11</p></div></div>
  <div class="hero" id="hero"></div>
 </div>
 <div class="chips" id="chips"></div>
 <div class="th"><span style="text-align:left">Cliente</span><span>Média</span><span>Fat.</span><span>Cart.</span><span>Freq.</span><span>Dias</span></div>
 <div class="list" id="list"></div>
 <div class="nav"><button class="on"><span>🛒</span>Mês atual</button><button><span>📈</span>Performance</button><button><span>🎯</span>Campanhas</button><button><span>🔎</span>Clientes</button></div>
</div>
<script>
const D=/*DATA*/;
const f=n=>Math.round(n).toLocaleString('pt-BR'), t=n=>(n/1000).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+' t';
const R=D.rows.map(r=>Object.assign(r,{vend:r.fat+r.cart}));
const tot=R.reduce((a,r)=>[a[0]+r.fat,a[1]+r.cart],[0,0]), com=R.filter(r=>r.fat>0).length, ped=R.filter(r=>!r.fat&&r.cart>0).length, sem=R.filter(r=>!r.vend).length, np=R.filter(r=>r.prime).length;
document.getElementById('hero').innerHTML=`<div class="cap">Clientes no mês</div>
 <div class="hrow"><b class="num">${com}</b><span>clientes com compra faturada<br>${ped} com pedido em carteira · ${sem} sem pedido</span></div>
 <div class="stats num"><div>faturado<b>${t(tot[0])}</b></div><div>carteira<b>${t(tot[1])}</b></div><div>sem pedido<b>${sem}</b></div></div>`;
const tone=p=>p>=1?'#0f9d6b':p>=.8?'#e0a800':'#e05252';
const dclass=r=>!r.freq?'d-b':r.dias<=r.freq?'d-ok':r.dias<=2*r.freq?'d-w':'d-b';
const F=[['Todos',()=>true],['Sem pedido',r=>!r.vend],['Abaixo da média',r=>r.base>0&&r.vend>0&&r.vend<r.base]];
let cur=0;
function draw(){document.getElementById('chips').innerHTML=F.map((x,i)=>`<button class="${i===cur?'on':''}" onclick="cur=${i};draw()">${x[0]}<small>${R.filter(x[1]).length}</small></button>`).join('');
 document.getElementById('list').innerHTML=R.filter(F[cur][1]).sort((a,b)=>b.base-a.base).map(r=>{
  return `<div class="r"><div class="g num"><div class="nm">${r.nome}</div><span>${f(r.base)}</span><span class="o">${r.fat?f(r.fat):'—'}</span><span class="cart">${r.cart?f(r.cart):'—'}</span><span>${r.freq?r.freq+'d':'—'}</span><span class="dd ${dclass(r)}">${r.dias}</span></div></div>`}).join('');}
draw();
</script></body></html>
