.phone{width:390px;max-width:100%;height:844px;margin:16px auto;background:var(--bg);border-radius:30px;box-shadow:0 24px 60px -24px rgba(0,0,0,.4);display:flex;flex-direction:column;overflow:hidden}
.num{font-variant-numeric:tabular-nums}
.scroll{flex:1;overflow-y:auto;padding:16px 14px 16px}

.bk h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em}.bk p{margin:0;font-size:11.5px;color:var(--mut)}
.hero{background:#16181d;color:#fff;border-radius:22px;padding:14px 15px;position:relative;overflow:hidden}

.cap{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#9fa1a9}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px;position:relative;z-index:1}
.vs>div{background:rgba(255,255,255,.07);border-radius:14px;padding:9px 10px}
.vs .t{font-size:10.5px;color:#9fa1a9;font-weight:700}
.vs .ab{display:flex;align-items:baseline;gap:6px;margin-top:3px}.vs .ab span{font-size:12px;color:#c9cad0}.vs .ab b{font-size:21px;font-weight:900;letter-spacing:-.02em}
.dl{display:inline-block;font-size:11.5px;font-weight:800;border-radius:99px;padding:2px 8px;margin-top:5px}

.upl{background:#e3f5ed;color:#0f9d6b}.dnl{background:#fde4e4;color:#d64545}

.fr{display:grid;grid-template-columns:minmax(0,1fr) 92px 52px;gap:8px;align-items:center;padding:6px 0;border-top:1px solid #f0ede6;font-size:12px}

.fr .d{text-align:right;font-size:11.5px;font-weight:800;border-radius:99px;padding:2px 0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#f3f1ea;border-radius:12px;padding:3px;margin-bottom:6px}
.seg button{all:unset;cursor:pointer;text-align:center;font-size:12px;font-weight:800;padding:7px 0;border-radius:9px;color:#4a4c55}.seg button.on{background:#16181d;color:#ffc000}
.seg button small{font-weight:700;opacity:.7;margin-left:3px}
.cr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid #f0ede6;font-size:12px}
.cr:first-of-type{border-top:0}.cr .n{font-weight:700;line-height:1.2}.cr .n small{display:block;font-weight:600;color:var(--mut);font-size:10.5px;margin-top:1px}

.note{font-size:10.5px;color:var(--mut);margin:10px 2px 0;line-height:1.45}

 <div class="pb"><i style="width:${a/famMax*100}%;background:#d9d5ca"></i><i style="width:${b/famMax*100}%;background:${p>=0?'#0f9d6b':'#d64545'}"></i></div>
 <div class="d" style="color:${p>=0?'#0f9d6b':'#d64545'}">${p==null?'novo':(p>=0?'+':'')+String(p).replace('.',',')+'%'}</div></div>`}).join('')}
 <button class="more" onclick="allF=!allF;draw()">${allF?'mostrar menos':'ver todas as '+D.fam.filter(x=>x.kg_2025+x.kg_2026_fech>0).length+' famílias'}</button></div>
<div class="card"><div class="ch"><b>Clientes em queda</b><small>atenção da semana</small></div>
 <div class="seg">${['Volume','Mix','Frequência'].map((s,i)=>`<button class="${i===seg?'on':''}" onclick="seg=${i};allA=false;draw()">${s}<small>${[qv,qm,qf][i].length}</small></button>`).join('')}</div>
 ${rows.map(c=>`<div class="cr num"><div class="n">${c.nome}<small>${L[1](c)}</small></div><div class="v">${L[2](c)}</div></div>`).join('')||'<div class="note">Nenhum cliente nesta situação.</div>'}
 ${L[0].length>6?`<button class="more" onclick="allA=!allA;draw()">${allA?'mostrar menos':'ver todos os '+L[0].length}</button>`:''}</div>
<div class="card"><div class="ch"><b>Mix</b><small>itens por cliente · últimos 12 meses</small></div>
 <div class="mx num"><div style="background:#ffe1ea;color:#7a1f42"><span class="l">Mix médio</span><b>${String(Math.round(mixmed*10)/10).replace('.',',')}</b><small>Regional ${String(D.mix_reg).replace('.',',')}</small></div>
 <div style="background:#16181d;color:#fff"><span class="l">Itens abandonados</span><b style="color:#ff8f8f">${f(C.reduce((a,c)=>a+c.ab,0))}</b><small>em ${C.filter(c=>c.ab).length} clientes</small></div></div>
 <div class="sub">Mais abandonados na sua carteira</div>
 ${D.ab_top.slice(0,6).map(([p,n])=>`<div class="cr num"><div class="n" style="font-weight:600">${p}</div><div class="v">${n}<small>clientes pararam</small></div></div>`).join('')}
 <div class="sub">Clientes abandonados</div>
 <div class="cr num"><div class="n">Sem compra há mais de 90 dias<small>ainda ativos no BI · voltar a visitar</small></div><div class="v">${sem90}</div></div>
 <div class="cr num"><div class="n">Inativos no BI<small>situação do cliente = inativo</small></div><div class="v">${T.inativos}</div></div></div>
<div class="note">Prévia com ${A0} × ${A1}; em 2027 a tela compara ${+A0+1} × ${+A1+1}. Item abandonado = comprado em 2025 e sem compra nos últimos 12 meses (inclui itens que saíram de linha). Novembro de ${A0} entra com uma extração mensal extra.</div>`;}
draw();
</script></body></html>
