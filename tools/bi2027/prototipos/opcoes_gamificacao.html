<style>
:root{--bg:#f4f2ec;--card:#fff;--line:#e7e3d8;--fg:#16181d;--mut:#6c6f78;--gold:#ffc000;--gold2:#fff3c4;--ok:#0f9d6b;--okb:#e3f5ed;--warn:#c98a00;--warnb:#fff4d6;--bad:#d64545;--badb:#fbe9e9;--blue:#2f6fd6;--blueb:#e6eefb;--ink:#16181d;--pur:#6b4de6}

.opts button.on{background:var(--ink);color:#fff;border-color:var(--ink)}.opts button.on small{color:var(--gold)}

.ov{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:900;font-size:16px;flex:none;color:#fff}
.mis{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}.mis:first-of-type{border-top:0}
.mis .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px;flex:none;background:#f1eee6}
.mis .t{flex:1}.mis .t b{font-size:13px;display:block}.mis .t small{font-size:11.5px;color:var(--mut)}
.xp{font-weight:800;font-size:12px;color:var(--pur);white-space:nowrap}
.path{display:flex;align-items:center;gap:0;margin:8px 0 2px;overflow:hidden}
.nd{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none;background:#3a3c44;color:#9ea0a8}
.nd.done{background:var(--gold);color:var(--ink)}.nd.cur{background:#fff;color:var(--ink);box-shadow:0 0 0 4px rgba(255,192,0,.45)}
.ln{height:4px;flex:1;background:#3a3c44}.ln.done{background:var(--gold)}
.stk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st{border-radius:12px;padding:9px 8px;min-height:96px;position:relative;border:2px solid}

.fs{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:4px;font-size:9.5px;font-weight:700;line-height:1.15}
.fs .n{font-size:15px;font-weight:900}
.fs.miss{background:repeating-linear-gradient(45deg,#fff,#fff 4px,#f1eee6 4px,#f1eee6 8px);border:1px dashed #d1cbbb;color:#9b9488}

.hp{display:flex;gap:2px;margin-top:4px}.hp i{flex:1;height:6px;border-radius:2px;background:#e5e1d6}
.up{color:var(--ok);font-weight:700}.dn{color:var(--bad);font-weight:700}

.ev b{font-size:13px}.ev small{display:block;font-size:11px;opacity:.8}

.ttl{font-size:20px;font-weight:900;margin:6px 0 2px;letter-spacing:-.02em}.sub{color:var(--mut);font-size:12.5px;margin-bottom:10px}

 <div class="card"><div class="h"><h3>Artilheiros · itens</h3><span>kg/mês · clientes</span></div>${D.itensRC.slice(0,5).map((x,i)=>`<div class="row"><div class="pos">${i+1}</div><div class="nm"><b>${x[0]}</b></div><div class="r">${fmt(x[1])}<small>${x[2]} clientes</small></div></div>`).join('')}</div>
 <div class="card"><div class="h"><h3>Copas em disputa</h3><span>campanhas</span></div>
 <div class="ev" style="background:var(--gold2)"><div><b>🏆 Copa Baldes</b><small>${balde} clientes classificados · ${baldePerto.length} a até 40% da linha</small></div><span class="chip c-gold">nov</span></div>
 <div class="ev" style="background:#f1eee6"><div><b>🚲 Copa Bicicleta</b><small>${bike} classificados · melhor: ${bikePerto[0]?short(bikePerto[0].nome)+' ('+pc(bikePerto[0].bp)+')':'—'}</small></div><span class="chip c-gray">até 31/12</span></div>
 ${camps.map(c=>`<div class="ev" style="background:#f8f7f3"><div><b>${c[0]}</b><small>torneio relâmpago</small></div><span class="chip c-blue">até ${c[1]}</span></div>`).join('')}</div>`;}],

['jornada','Jornada','missões diárias',()=>{
 const lv=Math.floor(me.pts/100), xpLv=me.pts%100;
 const mis=[['📞','Pedido da vez',`Falar com ${Math.min(3,vez.length)} clientes: ${vez.slice(0,3).map(c=>short(c.nome)).join(', ')}`,`${vez.length} na fila`,30],
  ['🧩','Nova família',perto[0]?`${short(perto[0].nome)} está a 1 família do degrau ${perto[0].nx[1]}% — ofereça ${fr.find(f=>!perto[0].fams.includes(f))}`:'—',`${perto.length} clientes a 1 família`,40],
  ['🪣','Fechar um balde',baldePerto[0]?`${short(baldePerto[0].nome)}: faltam ${fmt(baldePerto[0].cp.ob-baldePerto[0].cp.bm)} kg de FN + Origens`:'—',`${balde} já fecharam`,50],
  ['🚑','Resgate',risco[0]?`Recuperar ${short(risco[0].nome)} — ${risco[0].dias} dias sem pedido`:'—',`${risco.length} em risco`,60]];
 return `<div class="ttl">Sua jornada</div><div class="sub">Missões curtas todo dia; cada uma vale XP e sobe o seu nível.</div>
 <div class="hero"><div style="display:flex;justify-content:space-between;align-items:center"><div><div class="l">Nível</div><div class="big">${lv}</div></div><div style="text-align:right"><div class="l">XP no mês</div><div style="font-size:26px;font-weight:900">${me.pts}</div><div class="s">${100-xpLv} XP para o nível ${lv+1}</div></div></div>
 <div class="path">${[...Array(10)].map((_,i)=>`<div class="nd ${i+1<lv?'done':i+1===lv?'cur':''}">${i+1}</div>${i<9?`<div class="ln ${i+1<lv?'done':''}"></div>`:''}`).join('')}</div>
 <div class="s" style="margin-top:8px">🔥 Positivação do mês: <b style="color:#fff">${posit} de ${C.length}</b> clientes já compraram em novembro</div></div>
 <div class="card"><div class="h"><h3>Missões de hoje</h3><span>XP</span></div>${mis.map(m=>`<div class="mis"><div class="ic">${m[0]}</div><div class="t"><b>${m[1]}</b><small>${m[2]}</small><br><small style="color:var(--fg);font-weight:600">${m[3]}</small></div><div class="xp">+${m[4]} XP</div></div>`).join('')}</div>
 <div class="card"><div class="h"><h3>Habilidades · desempenho</h3><span>meta do mês = 100%</span></div>${[['Volume',me.vol],['Positivação',posit/C.length/0.7],['Mix',me.mix/15],['Carteira em dia',me.emdia/0.9]].map(([n,v])=>`<div style="margin:8px 0"><div style="display:flex;justify-content:space-between;font-size:12.5px;font-weight:600"><span>${n}</span><span style="color:${cor(v)}">${pc(Math.min(v,1.5))}</span></div><div class="pl"><i style="width:${Math.min(v,1)*100}%;background:${cor(v)}"></i></div></div>`).join('')}<div class="note" style="margin:6px 0 0">Referências de exemplo: positivação 70%, mix 15 famílias, 90% em dia.</div></div>
 <div class="card"><div class="h"><h3>Trilha dos clientes</h3><span>degrau de mix</span></div>${C.slice(0,6).map(c=>`<div class="row"><div class="nm"><b>${short(c.nome)}</b><small>${c.nx?`${c.nf}/${c.nx[0]} famílias para ${c.nx[1]}%`:'topo da escada'}</small><div class="pl" style="margin-top:4px"><i style="width:${c.nx?c.nf/c.nx[0]*100:100}%;background:var(--pur)"></i></div></div><div class="r"><span class="chip c-gold">${c.dg||0}%</span></div></div>`).join('')}</div>
 <div class="card"><div class="h"><h3>Famílias desbloqueadas</h3><span>clientes que compram</span></div>${fam.slice(0,6).map(f=>`<div style="margin:7px 0"><div style="display:flex;justify-content:space-between;font-size:12.5px"><b>${f.n}</b><span>${f.p}/${C.length} <span class="${f.v>=0?'up':'dn'}">${f.v==null?'':(f.v>=0?'▲':'▼')+Math.round(Math.abs(f.v)*100)+'%'}</span></span></div><div class="pl"><i style="width:${f.p/C.length*100}%;background:var(--ink)"></i></div></div>`).join('')}</div>
 <div class="card"><div class="h"><h3>Itens mais fortes</h3><span>kg/mês</span></div>${D.itensRC.slice(0,4).map(x=>`<div class="row"><div class="nm"><b>${x[0]}</b><small>${x[2]} clientes</small></div><div class="r">${fmt(x[1])}</div></div>`).join('')}</div>
 <div class="card"><div class="h"><h3>Eventos por tempo limitado</h3><span>XP em dobro</span></div>${[['🪣 Baldes · novembro',`${balde} fechados`,'12 dias'],['🚲 Bicicleta · 4º tri',`${bike} fechadas`,'43 dias']].concat(camps.map(c=>[c[0],'campanha ativa','até '+c[1]])).map(e=>`<div class="row"><div class="nm"><b>${e[0]}</b><small>${e[1]}</small></div><div class="r"><span class="chip c-blue">${e[2]}</span></div></div>`).join('')}</div>`;}],

['album','Álbum','coleção',()=>{
 const tot=C.length*fr.slice(0,16).length, tem=C.reduce((s,c)=>s+fr.slice(0,16).filter(f=>c.fams.includes(f)).length,0);
 const rar=c=>c.kg>=1500?['LENDÁRIA','#ffc000','#16181d']:c.kg>=700?['ÉPICA','#6b4de6','#fff']:c.kg>=250?['RARA','#2f6fd6','#fff']:['COMUM','#e7e3d8','#16181d'];
 const fs16=fr.slice(0,16).map(f=>({f,n:C.filter(c=>c.fams.includes(f)).length}));
 return `<div class="ttl">Álbum da carteira 2027</div><div class="sub">Cada família que o cliente compra é uma figurinha. Completar o álbum = mix completo.</div>
 <div class="hero"><div class="l">Álbum completo</div><div style="display:flex;align-items:flex-end;gap:12px"><div class="big">${pc(tem/tot)}</div><div class="s" style="padding-bottom:6px">${fmt(tem)} de ${fmt(tot)} figurinhas<br>16 famílias × ${C.length} clientes</div></div><div class="pb"><i style="width:${tem/tot*100}%"></i></div>
 <div class="s">Ranking de colecionadores: <b style="color:#fff">${myPos}º de 10</b> · volume ${pc(me.vol)} do objetivo · ${posit} clientes positivados no mês</div></div>
 <div class="card"><div class="h"><h3>Figurinhas da carteira</h3><span>raridade = volume · ★ = degrau</span></div><div class="stk">${C.slice(0,9).map(c=>{const r=rar(c);return `<div class="st" style="background:${r[1]}1a;border-color:${r[1]}"><span class="rar" style="color:${r[1]==='#e7e3d8'?'#888':r[1]}">${r[0]}</span><div style="height:12px"></div><b>${short(c.nome)}</b><div class="v">${fmt(c.kg)}<span style="font-size:10px;font-weight:600"> kg/mês</span></div><small style="color:var(--warn)">${'★'.repeat(c.dg/2)}${'☆'.repeat(5-c.dg/2)}</small><small style="color:var(--mut)">${c.nf} famílias</small></div>`}).join('')}</div>
 <div class="note">Toque numa figurinha para ver as famílias que faltam (na versão final).</div></div>
 <div class="card"><div class="h"><h3>Coleção por família</h3><span>clientes que têm</span></div><div class="fam">${fs16.map(x=>{const p=x.n/C.length;return p<.15?`<div class="fs miss"><span class="n">${x.n}</span>${x.f}</div>`:`<div class="fs" style="background:rgba(22,24,29,${.1+.8*p});color:${p>.45?'#fff':'var(--fg)'}"><span class="n">${x.n}</span>${x.f}</div>`}).join('')}</div></div>
 <div class="card"><div class="h"><h3>Desempenho por família</h3><span>kg/mês 2026 vs 2025</span></div>${fam.slice(0,6).map(f=>`<div class="row"><div class="nm"><b>${f.n}</b><small>${f.p} clientes</small></div><div class="r">${fmt(f.m26)}<small class="${f.v>=0?'up':'dn'}">${f.v==null?'':(f.v>=0?'▲ ':'▼ ')+Math.round(Math.abs(f.v)*100)+'%'}</small></div></div>`).join('')}</div>
 <div class="card"><div class="h"><h3>Figurinhas que mais faltam</h3><span>itens · nº de clientes sem</span></div>${(()=>{const m={};C.forEach(c=>c.sug.slice(0,5).forEach(s=>m[s[0]]=(m[s[0]]||0)+1));return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([p,n])=>`<div class="row"><div class="nm"><b>${p}</b><small>top da Regional</small></div><div class="r">${n}<small>clientes sem</small></div></div>`).join('')})()}
 <div class="h" style="margin-top:10px"><h3 style="font-size:13px">Repetidas (mais fortes)</h3><span></span></div>${D.itensRC.slice(0,3).map(x=>`<div class="row"><div class="nm"><b>${x[0]}</b></div><div class="r">${x[2]}<small>clientes</small></div></div>`).join('')}</div>
 <div class="card"><div class="h"><h3>Pacotes especiais</h3><span>campanhas</span></div>
 <div class="ev" style="background:#16181d;color:#fff"><div><b>🎁 Pacote Baldes</b><small>${balde} figurinhas douradas conquistadas</small></div><span class="chip c-gold">nov</span></div>
 <div class="ev" style="background:#f1eee6"><div><b>🎁 Pacote Bicicleta</b><small>${bike} conquistadas · 15 itens novos + volume</small></div><span class="chip c-gray">4º tri</span></div>
 ${camps.map(c=>`<div class="ev" style="background:#f8f7f3"><div><b>${c[0]}</b><small>pacote por tempo limitado</small></div><span class="chip c-blue">até ${c[1]}</span></div>`).join('')}</div>`;}],

['passe','Temporada','passe de batalha',()=>{
 const tier=Math.floor(me.pts/40), tot=25;
 const ch=[['Positivar a carteira',posit,Math.ceil(C.length*.7),'clientes com pedido no mês',100],['Pedidos da vez atendidos',0,vez.length,'clientes com pedido vencendo',80],['Subir clientes de degrau',0,perto.length,'a 1 família do próximo',120],['Baldes fechados',balde,Math.max(balde+3,12),'FN + Origens no mês',100],['Resgatar clientes',0,risco.length,'atrasados e em risco',150]];
 return `<div class="ttl">Temporada 2027</div><div class="sub">Passe da temporada: desafios semanais e mensais sobem de nível; cada marco tem recompensa.</div>
 <div class="hero"><div class="l">Nível da temporada</div><div style="display:flex;align-items:flex-end;gap:12px"><div class="big">${tier}</div><div class="s" style="padding-bottom:6px">de ${tot} · ${me.pts} pts<br>${myPos}º na Regional</div></div>
 <div class="tier">${[...Array(10)].map((_,i)=>{const n=Math.max(1,tier-4)+i;return `<div class="${n<tier?'done':n===tier?'cur':''}">${n%5===0?'🎁':n}</div>`}).join('')}</div>
 <div class="s">Próxima recompensa no nível ${Math.ceil((tier+1)/5)*5} (exemplo: reconhecimento no ranking mensal)</div></div>
 <div class="card"><div class="h"><h3>Desafios de novembro</h3><span>progresso · pts</span></div>${ch.map(c=>{const v=c[2]?Math.min(c[1]/c[2],1):0;return `<div style="padding:9px 0;border-top:1px solid var(--line)"><div style="display:flex;justify-content:space-between;gap:8px"><div><b style="font-size:13px">${c[0]}</b><div style="font-size:11.5px;color:var(--mut)">${c[3]}</div></div><div style="text-align:right"><b>${c[1]}/${c[2]}</b><div class="xp">+${c[4]}</div></div></div><div class="pl" style="margin-top:6px"><i style="width:${v*100}%;background:var(--pur)"></i></div></div>`}).join('')}<div class="note" style="margin:8px 0 0">Os desafios de "atendidos/resgatados" começam em 0 e sobem a cada atualização.</div></div>
 <div class="card"><div class="h"><h3>Seu desempenho</h3><span>novembro</span></div><div class="g2">${[['Volume vendido',pc(me.vol),fmt(me.fat+me.cart)+' de '+fmt(me.obj)+' kg',cor(me.vol)],['Mix médio',me.mix.toFixed(1),'famílias/cliente','var(--fg)'],['Em dia',pc(me.emdia),'carteira no ritmo','var(--fg)'],['Positivação',pc(posit/C.length),posit+' clientes','var(--fg)']].map(t=>`<div class="tile"><div class="l">${t[0]}</div><div class="v" style="color:${t[3]}">${t[1]}</div><div class="s">${t[2]}</div></div>`).join('')}</div></div>
 <div class="card"><div class="h"><h3>Vida dos clientes</h3><span>barra = ritmo de compra</span></div>${C.slice(0,8).map(c=>`<div class="row"><div class="nm"><b>${short(c.nome)}</b><div class="hp">${[...Array(5)].map((_,i)=>`<i style="${i<c.st[2]?'background:'+(c.st[2]>=4?'var(--ok)':c.st[2]>=2?'var(--warn)':'var(--bad)'):''}"></i>`).join('')}</div></div><div class="r">${fmt(c.kg)}<small>${c.nf} fam · ${c.dg}%</small></div></div>`).join('')}</div>
 <div class="card"><div class="h"><h3>Power-ups · famílias</h3><span>2026 vs 2025</span></div><div class="g2">${fam.slice(0,6).map(f=>`<div class="tile"><div class="l">${f.n}</div><div class="v">${fmt(f.m26)}</div><div class="s"><span class="${f.v>=0?'up':'dn'}">${f.v==null?'novo':(f.v>=0?'▲ ':'▼ ')+Math.round(Math.abs(f.v)*100)+'%'}</span> · ${f.p} clientes</div></div>`).join('')}</div></div>
 <div class="card"><div class="h"><h3>Itens da temporada</h3><span>kg/mês</span></div>${D.itensRC.slice(0,4).map(x=>`<div class="row"><div class="nm"><b>${x[0]}</b><small>${x[2]} clientes</small></div><div class="r">${fmt(x[1])}</div></div>`).join('')}</div>
 <div class="card"><div class="h"><h3>Eventos da temporada</h3><span>campanhas</span></div>
 ${[['🪣 Baldes',`${balde} fechados · ${baldePerto.length} quase lá`,'nov','c-gold'],['🚲 Bicicleta',`${bike} fechadas · líder ${bikePerto[0]?short(bikePerto[0].nome):'—'}`,'31/12','c-gray']].concat(camps.map(c=>[c[0],'evento ativo',c[1],'c-blue'])).map(e=>`<div class="row"><div class="nm"><b>${e[0]}</b><small>${e[1]}</small></div><div class="r"><span class="chip ${e[3]}">${e[2]}</span></div></div>`).join('')}</div>`;}]];

OPS.forEach(([k,t,s,f],i)=>{const b=document.createElement('button');b.innerHTML=`${i+1}. ${t}<small>${s}</small>`;if(!i)b.className='on';
 const d=document.createElement('div');d.className='op'+(i?'':' on');d.id='op-'+k;d.innerHTML=f();document.getElementById('ops').appendChild(d);
 b.onclick=()=>{document.querySelectorAll('.opts button').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelectorAll('.op').forEach(x=>x.classList.toggle('on',x===d));scrollTo(0,0)};document.getElementById('opts').appendChild(b);});
</script></body></html>
