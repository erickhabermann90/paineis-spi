<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex, nofollow">
<title>Painel do gestor</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f3ee;--fg:#16181d;--mut:#8a8c93;--ok:#0f9d6b;--warn:#c98a00;--bad:#d64545}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.35 Inter,system-ui,sans-serif}
.num{font-variant-numeric:tabular-nums}
.app{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:16px 16px 0}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.hd h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.03em}.hd p{margin:1px 0 0;font-size:12px;color:var(--mut)}
.av{width:40px;height:40px;border-radius:50%;background:#16181d;color:#ffc000;display:grid;place-items:center;font-weight:900;font-size:16px;flex:none}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:#ebe7dd;border-radius:14px;padding:3px;margin-bottom:10px}
.tabs button{all:unset;cursor:pointer;text-align:center;font-size:12.5px;font-weight:800;padding:8px 0;border-radius:11px;color:#4a4c55}.tabs button.on{background:#16181d;color:#ffc000}
.tabs button small{display:block;font-size:9.5px;font-weight:700;opacity:.65;margin-top:1px}
/* volume geral */
.hero{background:#16181d;color:#fff;border-radius:24px;padding:16px 16px 14px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(255,192,0,.28),transparent 70%);pointer-events:none}
.cap{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#9fa1a9}
.big{display:flex;align-items:baseline;gap:8px;margin:2px 0 8px}.big b{font-size:46px;font-weight:900;letter-spacing:-.04em;line-height:1;color:#ffc000}.big span{font-size:12.5px;color:#c9cad0}
.trk-w{position:relative;padding-top:4px}
.trk{height:8px;border-radius:99px;background:rgba(255,255,255,.12);display:flex;overflow:hidden}
.trk i{display:block;height:100%;width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.trk .f{background:var(--c)}.trk .c{background:repeating-linear-gradient(-45deg,rgba(255,255,255,.5) 0 4px,transparent 4px 8px),var(--c);opacity:.55;background-size:11px 11px;animation:mv 1s linear infinite}
.trk .x{background:rgba(61,220,151,.45)}
@keyframes mv{to{background-position:11px 0}}
.cp{position:absolute;top:0;bottom:-3px;width:0;border-left:2px solid rgba(255,255,255,.35)}.cp.ok{border-color:#ffc000}
.k .cp{top:-3px;bottom:-3px;border-left:1.5px solid rgba(0,0,0,.25)}.k.dk .cp{border-color:rgba(255,255,255,.35)}
.leg3{margin-top:8px;font-size:11.5px;color:#c9cad0}.leg3 b{color:#fff;font-weight:700}
.cps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:9px;position:relative;z-index:1}
.cps span{background:rgba(255,255,255,.07);border-radius:10px;padding:5px 7px;font-size:11px;color:#9fa1a9;display:flex;flex-direction:column;line-height:1.25}
.cps b{font-size:14px;color:#fff;font-weight:800}.cps .ok b{color:#5fe0a8}.cps .nx{background:rgba(255,192,0,.16);color:#ffd24d}.cps .nx b{color:#ffd24d}
.exc{margin-top:10px;padding-top:9px;border-top:1px solid rgba(255,255,255,.1);font-size:12px;color:#c9cad0;display:flex;justify-content:space-between;gap:10px;position:relative;z-index:1}.exc b{color:#fff}.exc .g{color:#5fe0a8}
/* kpis */
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:12px}
.k{box-shadow:0 12px 24px -12px rgba(var(--sh,0,0,0),.55),inset 0 1px 0 rgba(255,255,255,.6);border-radius:20px;padding:12px 13px 11px;position:relative;color:var(--fg)}
.k .top{height:26px;display:flex;align-items:center;gap:7px}
.k .lg{height:24px;max-width:96px;object-fit:contain}
.k .nm{white-space:nowrap;font-size:12px;font-weight:700}
.ic{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:14px}
.k .v{display:flex;align-items:baseline;font-size:32px;font-weight:900;letter-spacing:-.04em;margin:7px 0 8px;line-height:1}
.k .v small{white-space:nowrap;font-size:11px;font-weight:700;letter-spacing:0;margin-left:7px;opacity:.6}
.k .trk{height:6px;background:rgba(0,0,0,.07)}
.k.dk{color:#fff}.k.dk .trk{background:rgba(255,255,255,.14)}
.k .gp{display:flex;justify-content:space-between;align-items:baseline;margin-top:7px;font-size:11px;gap:6px}.k .gp b{font-weight:800;white-space:nowrap}.k .gp span{opacity:.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.base{grid-column:1/-1;background:#fff;border-radius:20px;padding:13px 14px;display:grid;grid-template-columns:1fr 1px 1fr;gap:12px;align-items:center;box-shadow:0 12px 24px -14px rgba(60,40,120,.35)}
.base .sep{background:#ece9e1;height:70%}
.vb{display:flex;align-items:flex-end;gap:11px}
.vt{width:18px;height:70px;border-radius:99px;background:#efece5;display:flex;flex-direction:column-reverse;overflow:hidden;position:relative;flex:none}
.vt i{display:block;width:100%;height:0;transition:height 1.1s cubic-bezier(.2,.8,.2,1)}
.vt .f{background:var(--c)}.vt .c{background:repeating-linear-gradient(-45deg,rgba(255,255,255,.5) 0 3px,transparent 3px 6px),var(--c);opacity:.5}
.vb .t{font-size:11.5px;color:var(--mut);line-height:1.35}.vb .t b{display:block;font-size:24px;font-weight:900;color:var(--fg);letter-spacing:-.03em;line-height:1.05}.vb .t em{font-style:normal;font-weight:700;color:var(--fg)}
.foot{font-size:10px;color:var(--mut);margin:10px 0 0;text-align:center}
/* botão representantes */
.dock{position:sticky;bottom:0;margin:auto -16px 0;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 75%,rgba(245,243,238,0))}
.go{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;width:100%;box-sizing:border-box;background:#16181d;color:#fff;border-radius:18px;padding:12px 16px;box-shadow:0 14px 28px -14px rgba(0,0,0,.6)}
.go .i{width:36px;height:36px;border-radius:12px;background:#ffc000;color:#16181d;display:grid;place-items:center;font-size:18px;flex:none}
.go b{display:block;font-size:15px}.go small{color:#9fa1a9;font-size:11.5px}.go .ar{margin-left:auto;font-size:20px;color:#ffc000}
/* lista de RCs */
.sheet{position:fixed;inset:0;background:rgba(10,10,12,.5);display:none;z-index:20}.sheet.on{display:block}
.sh{position:absolute;left:0;right:0;bottom:0;max-height:88dvh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto}
.sh h2{margin:4px 2px 10px;font-size:18px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.sh h2 button{all:unset;cursor:pointer;width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:18px;box-shadow:0 4px 10px -6px rgba(0,0,0,.3)}
.rc{all:unset;cursor:pointer;display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;box-sizing:border-box;background:#fff;border-radius:16px;padding:10px 12px;margin-bottom:6px;box-shadow:0 6px 14px -12px rgba(0,0,0,.35)}
.rc .p{width:28px;height:28px;border-radius:9px;background:#f1eee6;display:grid;place-items:center;font-weight:900;font-size:12px}.rc .p.t{background:#ffc000}
.rc .n{font-weight:700;font-size:13px;line-height:1.2}.rc .n small{display:block;font-weight:600;color:var(--mut);font-size:11px;margin-top:2px}
.rc .mb{height:4px;border-radius:99px;background:#efece5;margin-top:5px;overflow:hidden}.rc .mb i{display:block;height:100%}
.rc .v{text-align:right;font-weight:900;font-size:16px}.rc .v small{display:block;font-weight:700;font-size:10.5px;color:var(--mut)}
/* espelho */
.esp{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg);z-index:30}.esp.on{display:flex}
.bar{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#16181d;color:#fff}
.bar button{all:unset;cursor:pointer;font-weight:800;font-size:13px;padding:7px 10px;border-radius:10px;background:rgba(255,255,255,.1)}
.bar select{flex:1;min-width:0;font:700 13px Inter;padding:7px 8px;border-radius:10px;border:0;background:#ffc000;color:#16181d}
iframe{flex:1;width:100%;border:0;background:var(--bg)}
</style></head><body>

function kp(k,m){ if(!K) return null;
 if(m==='tri'){ let obj=0,fat=0; ordem.forEach(x=>{const y=K.meses[x]&&K.meses[x][k]; if(y){obj+=y[0];fat+=y[1];}}); if(!obj) return null;

 const x=K.meses[m]&&K.meses[m][k]; if(!x) return null; const [obj,fat]=x, cart=m===mm?(CT[k]||0):0, vend=fat+cart, i=ordem.indexOf(m);
 let exc=0; ordem.slice(0,Math.max(0,i)).forEach(q=>{const y=K.meses[q]&&K.meses[q][k]; if(y) exc+=y[1]+(q===mm?(CT[k]||0):0)-y[0];});
 const prox=ordem[i+1], o2=prox&&K.meses[prox]&&K.meses[prox][k]?K.meses[prox][k][0]:null, futuro=+m>+mm;
 return {obj,fat,cart,vend,pv:vend/obj,pf:fat/obj,gap:Math.max(obj-vend,0),exc,px:(vend+exc)/obj,prox:futuro?null:prox,need:!futuro&&o2!=null?Math.max(o2-(exc+vend-obj),0):null,fech:+m<+mm,futuro,need_ini:futuro?Math.max(obj-exc,0):null};}

let html=T.map(([k,o])=>{const x=kp(k,sel); if(!x) return ''; const un=k==='rs'?' mi':' t';
 return `<div class="k${o.dk?' dk':''}" style="background:${o.bg};--c:${o.c};--sh:${o.sh}"><div class="top">${o.top}</div>
 <div class="v num" style="color:${tone(x.pv,o.dk)}"><b data-n="${Math.round(x.pv*100)}">0%</b><small>de ${o.fx(x.obj)}${un}</small></div>
 <div class="trk-w"><div class="trk"><i class="f" data-w="${W(x.pf)}"></i><i class="c" data-w="${(Math.min(x.pv,1.1)-Math.min(x.pf,1.1))/1.1*100}%"></i></div>${ticks()}</div>
 <div class="gp num"><span>${o.fx(x.fat)} + ${o.fx(x.cart)}${un}</span><b style="color:${x.gap?(o.dk?'#ff9a9a':'#d64545'):tone(1,o.dk)}">${x.gap?'−'+o.fx(x.gap)+un:'✓ coberto'}</b></div></div>`}).join('');

const R=D.rcs.map(r=>Object.assign({},r,{pv:(r.fat+(r.carteira||0))/r.obj,p4:r.obj4t?r.real4t/r.obj4t:0})).sort((a,b)=>b.pv-a.pv);
$('gosub').textContent=R.length+' RCs · '+R.filter(r=>r.pv>=1).length+' com o mês vendido';
$('lista').innerHTML=R.map((r,i)=>`<button class="rc" data-s="${r.slug}"><span class="p ${i<3?'t':''}">${i+1}º</span><span class="n">${r.nome}<small>${tn(r.fat)} fat + ${tn(r.carteira||0)} cart · obj ${tn(r.obj)} · 4º tri ${pc(r.p4)}</small><span class="mb" style="display:block"><i style="width:${Math.min(r.pv,1)*100}%;background:${tone(r.pv)}"></i></span></span><span class="v num" style="color:${tone(r.pv)}">${pc(r.pv)}<small>vendido</small></span></button>`).join('');
R.slice().sort((a,b)=>a.nome.localeCompare(b.nome)).forEach(r=>{const o=document.createElement('option');o.value=r.slug;o.textContent=r.nome;$('sel').appendChild(o);});
$('go').onclick=()=>$('sheet').classList.add('on'); $('fecha').onclick=()=>$('sheet').classList.remove('on');
$('sheet').onclick=e=>{if(e.target.id==='sheet')$('sheet').classList.remove('on')};
$('lista').onclick=e=>{const b=e.target.closest('.rc'); if(b) location.hash=b.dataset.s;};
const mostrar=()=>{const s=location.hash.slice(1), r=D.rcs.find(x=>x.slug===s); $('esp').classList.toggle('on',!!r); if(!r) return; $('sheet').classList.remove('on'); $('sel').value=s; const src='../'+s+'/'; if($('frame').getAttribute('src')!==src) $('frame').setAttribute('src',src);};
$('sel').onchange=()=>location.hash=$('sel').value; $('voltar').onclick=()=>{location.hash='';};
addEventListener('hashchange',mostrar); mostrar();
function anima(){requestAnimationFrame(()=>setTimeout(()=>{document.querySelectorAll('[data-w]').forEach(e=>e.style.width=e.dataset.w);document.querySelectorAll('[data-h]').forEach(e=>e.style.height=e.dataset.h);
 document.querySelectorAll('[data-n]').forEach(e=>{const n=+e.dataset.n,t0=performance.now();const s=t=>{const k=Math.min((t-t0)/1000,1);e.textContent=Math.round(n*(1-Math.pow(1-k,3)))+'%';if(k<1)requestAnimationFrame(s)};requestAnimationFrame(s)});},120));}
function tabs(){ $('tabs').innerHTML=[...ordem,'tri'].map(m=>`<button class="${m===sel?'on':''}" data-m="${m}">${m==='tri'?'4º tri':nomes[m].slice(0,3).replace(/^./,c=>c.toUpperCase())}<small>${m==='tri'?'out–dez':m===mm?'atual':+m<+mm?'fechado':'próximo'}</small></button>`).join(''); }
$('tabs').onclick=e=>{const b=e.target.closest('button'); if(!b) return; sel=b.dataset.m; tabs(); render(); anima();};
tabs(); render(); anima();
