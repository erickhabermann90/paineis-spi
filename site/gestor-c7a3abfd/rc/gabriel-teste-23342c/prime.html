<!doctype html>
<html lang="pt-BR"><head><meta name="robots" content="noindex, nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prime</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f3ee;--fg:#16181d;--mut:#8a8c93}
*{box-sizing:border-box}body{margin:0;background:#d9d5ca;font:14px/1.35 Inter,system-ui,sans-serif;color:var(--fg)}
.phone{width:390px;max-width:100%;height:844px;margin:16px auto;background:var(--bg);border-radius:30px;box-shadow:0 24px 60px -24px rgba(0,0,0,.4);display:flex;flex-direction:column;overflow:hidden}
@media (max-width:500px){.phone{margin:0;border-radius:0;height:100dvh}}
.num{font-variant-numeric:tabular-nums}
.scroll{flex:1;overflow-y:auto;padding:16px 14px 16px}
.bk{display:flex;align-items:center;gap:10px;margin-bottom:12px}.bk span{width:34px;height:34px;border-radius:12px;background:#fff;display:grid;place-items:center;box-shadow:0 4px 10px -6px rgba(0,0,0,.3)}
.bk h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em}.bk p{margin:0;font-size:11.5px;color:var(--mut)}
.hero{background:#16181d;color:#fff;border-radius:22px;padding:14px 15px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-50px;top:-50px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(255,192,0,.28),transparent 70%)}
.cap{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#9fa1a9}
.hs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:9px;position:relative;z-index:1}
.hs div{background:rgba(255,255,255,.08);border-radius:12px;padding:7px 9px;font-size:10.5px;color:#9fa1a9}.hs b{display:block;font-size:20px;color:#fff;font-weight:900}
.card{background:#fff;border-radius:20px;padding:12px 14px;margin-top:10px;box-shadow:0 10px 22px -16px rgba(0,0,0,.4)}
.card.ok{background:linear-gradient(150deg,#f1faf5,#dcf3e7)}
.nm{font-size:13.5px;font-weight:800;line-height:1.2}.sub{font-size:10.5px;color:var(--mut);margin-top:2px}
.tot{display:flex;align-items:baseline;justify-content:space-between;margin-top:8px}.tot b{font-size:26px;font-weight:900;letter-spacing:-.02em}.tot span{font-size:11.5px;color:#5b5d64;text-align:right}.tot span b{font-size:12.5px;color:#16181d;letter-spacing:0}
.trk{height:8px;border-radius:99px;background:#efece5;overflow:hidden;margin:6px 0 2px}.trk i{display:block;height:100%;border-radius:99px}
.gr{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:9px}
.gr div{background:#f7f5ef;border-radius:11px;padding:6px 8px;font-size:9.5px;color:var(--mut);line-height:1.25}.card.ok .gr div{background:rgba(255,255,255,.7)}
.gr b{display:block;font-size:15px;font-weight:900;margin:1px 0}
.note{font-size:10.5px;color:var(--mut);margin:12px 2px 0;line-height:1.45}
.nav{display:grid;grid-template-columns:repeat(5,1fr);background:#fff;padding:9px 6px 16px;border-top:1px solid #ece9e1}
.nav button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:#3a3c44}
.nav button span{width:38px;height:30px;border-radius:12px;display:grid;place-items:center;font-size:16px;background:#f3f1ea}.nav button.on span{background:#16181d}
.gr .gl{display:flex;align-items:flex-end;min-height:2.5em}
.fx{display:flex;justify-content:space-between;align-items:center;margin-top:8px;background:#fde8e8;color:#b42323;border-radius:12px;padding:8px 12px;font-size:12.5px;font-weight:700}
.fx b{font-size:20px;font-weight:900;letter-spacing:-.02em}.fx.ok{background:#e3f5ed;color:#0b7a52;justify-content:center}
.gr em{display:block;font-style:normal;font-weight:800;font-size:10.5px;color:#b42323;margin-top:3px}.gr em.ok{color:#0b7a52}
.gr .rb{display:inline-block;font-size:9.5px;font-weight:900;color:#16181d;background:#ffc000;border-radius:99px;padding:1px 7px;margin-bottom:3px}
.gr div.lib{background:#e3f5ed !important;box-shadow:inset 0 0 0 1.5px #0f9d6b}
.fx-n{font-size:10.5px;color:#b42323;margin:4px 2px 0}
@media (max-width:500px){.phone{margin:0 !important;border-radius:0 !important;height:100dvh !important;min-height:0 !important;box-shadow:none !important}}
.nav{flex:none}
</style></head><body>
<div class="phone"><div class="scroll" id="app"></div>
<div class="nav"><button><span>🛒</span>Mês atual</button><button><span>📈</span>Performance</button><button class="mid"><span>🔎</span>Clientes</button><button><span>🎯</span>Campanhas</button><button><span>⭐</span>Prime</button></div></div>
<script>
const D={"data":"27/11","redes":[{"cod":"133752","rede":"V DE ARAUJO SILVA AGROPECUARIA","obj":18375,"real":15380,"g":[{"k":"G1","obj":735,"real":169},{"k":"G2","obj":2520,"real":153},{"k":"G3","obj":7035,"real":6361}]},{"cod":"4886","rede":"REDE AGRO CARDOSO","obj":31500,"real":23731,"g":[{"k":"G1","obj":1365,"real":760},{"k":"G2","obj":4935,"real":3601},{"k":"G3","obj":9660,"real":6595}]},{"cod":"1050","rede":"REDE CENTRAL PARK RACOES","obj":24150,"real":12641,"g":[{"k":"G1","obj":1365,"real":587},{"k":"G2","obj":3885,"real":2142},{"k":"G3","obj":7035,"real":4329}]}]};
const f=n=>Math.round(n).toLocaleString('pt-BR');
const tone=p=>p>=1?'#0f9d6b':p>=.8?'#c98a00':'#d64545';
const G={G1:'FN Fresh, FN Vet e Pet Care',G2:'FN Life e FN Pro',G3:'Origens'}, PCT={G1:3,G2:2,G3:1};
const L=D.redes.map(r=>Object.assign(r,{p:r.real/r.obj})).sort((a,b)=>a.p-b.p);
const ok=L.filter(r=>r.p>=1).length, falta=L.reduce((a,r)=>a+Math.max(r.obj-r.real,0),0);
document.getElementById('app').innerHTML=`<div class="bk"><span>←</span><div><h1>Prime</h1><p>Rebate · objetivo negociado com o cliente · dados de ${D.data}</p></div></div>
<div class="hero"><div class="cap">Clientes Prime</div><div class="hs num"><div>clientes<b>${L.length}</b></div><div>objetivo atingido<b style="color:#5fe0a8">${ok}</b></div><div>faltam no total<b>${(falta/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})} t</b></div></div></div>
${L.map(r=>`<div class="card${r.p>=1?' ok':''}"><div class="nm">${r.rede}</div><div class="sub">Cód. ${r.cod}</div>
 <div class="tot num"><b style="color:${tone(r.p)}">${Math.round(r.p*100)}%</b><span>comprou ${f(r.real)} de ${f(r.obj)} kg</span></div>
 <div class="trk"><i style="width:${Math.min(r.p,1)*100}%;background:${tone(r.p)}"></i></div>
 ${r.p>=1?`<div class="fx ok">✓ Volume total atingido · rebate liberado ${r.g.filter(g=>g.real>=g.obj).length?'em '+r.g.filter(g=>g.real>=g.obj).map(g=>PCT[g.k]+'%').join(' + '):'nas famílias que baterem'}</div>`:`<div class="fx"><span>Falta vender no total</span><b>${f(r.obj-r.real)} kg</b></div><div class="fx-n">Sem o volume total, nenhuma família recebe rebate.</div>`}
 <div class="gr num">${r.g.map(g=>{const p=g.obj?g.real/g.obj:0;const gb=g.real>=g.obj, lib=gb&&r.p>=1;
  return `<div class="${lib?'lib':''}"><span class="rb">rebate ${PCT[g.k]||''}%</span><span class="gl">${G[g.k]||g.k}</span><b style="color:${tone(p)}">${Math.round(p*100)}%</b>${f(g.real)} / ${f(g.obj)}<em class="${gb?'ok':''}">${lib?'✓ '+PCT[g.k]+'% garantido':gb?'✓ atingido · falta o total':'faltam '+f(g.obj-g.real)+' kg'}</em></div>`}).join('')}</div></div>`).join('')}
<div class="note">O cliente recebe o rebate de cada família que bater o objetivo (FN Fresh, FN Vet e Pet Care 3% · FN Life e FN Pro 2% · Origens 1%), desde que o volume total também seja atingido. Sem o volume total, nenhuma família recebe.</div>`;
</script><script>(()=>{const M={'Mês atual':'mes.html','Performance':'performance.html','Campanhas':'campanhas.html','Prime':'prime.html','Clientes':'clientes.html'};
const st=document.createElement('style');st.textContent='.nav button.mid span{width:48px;height:40px;font-size:21px;background:#ffc000!important;box-shadow:0 6px 14px -6px rgba(201,138,0,.8);margin-top:-12px}.nav button.mid{color:#16181d;font-weight:800}.nav button.mid.on span{background:#16181d!important}';document.head.appendChild(st);
document.querySelectorAll('.nav button').forEach(b=>{const k=[...b.childNodes].pop().textContent.trim(); if(M[k]){b.onclick=()=>location.href=M[k]; if(location.pathname.endsWith('/'+M[k])) b.classList.add('on');}});
document.querySelectorAll('.bk > span:first-child, .bk > button:first-child').forEach(e=>{if(!e.onclick){e.style.cursor='pointer'; e.onclick=()=>location.href='index.html';}});})();</script>
</body></html>
